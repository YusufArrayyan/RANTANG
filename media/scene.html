<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/app/node_modules/@fontsource/plus-jakarta-sans/latin-500.css">
<link rel="stylesheet" href="/app/node_modules/@fontsource/plus-jakarta-sans/latin-700.css">
<link rel="stylesheet" href="/app/node_modules/@fontsource/plus-jakarta-sans/latin-800.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; color: #23303A; background: #fff; position: relative; }
  .dark { background: #0A3B38; color: #fff; }
  .mint { background: #F3F8F6; }
  .ring { position: absolute; border-radius: 50%; border: 80px solid rgba(242,194,0,.1); }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 24px; letter-spacing: .05em; color: #116C65; }
  .brand img { width: 44px; }
  .dark .brand { color: #fff; }
  .tile { width: 64px; height: 64px; background: #fff; border-radius: 18px; display: grid; place-items: center; }
  .step { display: inline-block; font-size: 22px; font-weight: 700; color: #0B4F4A; background: #E8F2EE; padding: 8px 18px; border-radius: 999px; }
  .dark .step { background: rgba(255,255,255,.12); color: #F2C200; }
  h1 { font-size: 64px; font-weight: 800; line-height: 1.1; letter-spacing: -.015em; margin-top: 26px; }
  ul.b { list-style: none; margin-top: 40px; display: flex; flex-direction: column; gap: 22px; }
  ul.b li { font-size: 30px; font-weight: 500; display: flex; gap: 18px; align-items: baseline; }
  ul.b li::before { content: ''; width: 14px; height: 14px; border-radius: 4px; background: #116C65; flex-shrink: 0; transform: translateY(-4px); }
  .left { position: absolute; left: 110px; top: 110px; width: 1050px; }
  .phone { position: absolute; border-radius: 64px; background: #0d1414; padding: 14px; box-shadow: 0 40px 90px rgba(10,59,56,.28); }
  .phone .scr { border-radius: 50px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
  .phone .sb { height: 46px; display: flex; justify-content: space-between; align-items: center; padding: 8px 40px 0 44px; font-weight: 700; font-size: 17px; }
  .phone .slot, .phone img { display: block; width: 400px; height: 866px; object-fit: cover; object-position: top; }
  .phone::after { content: ''; position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 18px; background: #0d1414; }
  .laptop { position: absolute; }
  .laptop .screen { background: #0d1414; border-radius: 26px 26px 0 0; padding: 22px 22px 26px; box-shadow: 0 40px 90px rgba(10,59,56,.28); }
  .laptop .slot { width: 1120px; height: 700px; background: #fff; }
  .laptop .base { height: 28px; margin: 0 -80px; background: linear-gradient(#d9dfe1, #aeb7ba); border-radius: 0 0 28px 28px; }
  .nodes { display: flex; gap: 18px; align-items: stretch; margin-top: 70px; }
  .node { flex: 1; background: #fff; border: 2px solid #CFE2DD; border-radius: 24px; padding: 28px 24px; position: relative; }
  .node .k { font-size: 17px; font-weight: 800; color: #6B7880; letter-spacing: .06em; }
  .node b { display: block; font-size: 30px; font-weight: 800; color: #116C65; margin: 8px 0 10px; }
  .node p { font-size: 21px; line-height: 1.45; }
  .node + .node::before { content: '→'; position: absolute; left: -19px; top: 50%; transform: translate(-50%, -50%); font-size: 30px; color: #F2C200; font-weight: 800; }
  .node.hl { background: #0A3B38; border-color: #0A3B38; color: #fff; }
  .node.hl b { color: #F2C200; } .node.hl .k { color: rgba(255,255,255,.7); }
  pre { font-family: Consolas, monospace; font-size: 21px; line-height: 1.55; background: #0A3B38; color: #d8ece8; padding: 26px 30px; border-radius: 20px; }
  pre i { color: #F2C200; font-style: normal; }
  .lane { display: flex; align-items: center; gap: 22px; margin-top: 30px; }
  .pill { padding: 22px 30px; border-radius: 22px; font-size: 28px; font-weight: 800; }
  .arrow { font-size: 40px; color: #6B7880; font-weight: 800; }
  .note { font-size: 22px; color: #4A5862; font-weight: 500; margin-top: 8px; }
  .lockbar { margin-top: 44px; background: #0A3B38; color: #fff; border-radius: 22px; padding: 26px 32px; font-size: 25px; display: flex; gap: 16px; align-items: center; }
  .lockbar b { color: #F2C200; }
  .card { background: #fff; border: 2px solid #DDE5E3; border-radius: 26px; padding: 30px; }
  .card h3 { font-size: 30px; font-weight: 800; margin-bottom: 10px; }
  .card p { font-size: 23px; color: #4A5862; line-height: 1.45; }
  .tag { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 22px; }
</style>
</head>
<body>
<div id="r"></div>
<script>
const IMG = (n) => `/docs/media/screens/${n}.png`
const LOGO = '/app/public/icons/mark-128.png'
const brand = (dark) => `<div class="brand" style="position:absolute;left:110px;top:${dark ? 60 : 50}px"><img src="${LOGO}">RANTANG</div>`
const phone = (x, y, inner) => `<div class="phone" style="left:${x}px;top:${y}px"><div class="scr"><div class="sb"><span>09.41</span><span>5G ▮</span></div>${inner}</div></div>`
window.render = (s) => {
  document.body.className = ''
  let h = ''
  if (s.layout === 'title') {
    document.body.className = 'dark'
    h = `<div class="ring" style="width:1100px;height:1100px;right:-380px;top:-380px"></div><div class="ring" style="width:600px;height:600px;left:-260px;bottom:-300px"></div>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
        <div style="width:200px;height:200px;background:#fff;border-radius:52px;display:grid;place-items:center"><img src="${LOGO}" style="width:140px"></div>
        <h1 style="font-size:120px;letter-spacing:.06em;margin-top:44px">${s.title}</h1>
        <p style="font-size:38px;opacity:.85;margin-top:18px;font-weight:500">${s.sub}</p>
        <p style="font-size:24px;opacity:.6;margin-top:46px">Percontohan Kelurahan Sukamaju · Muhammad Yusuf Arrayyan</p>
      </div>`
  } else if (s.layout === 'problem') {
    document.body.className = 'mint'
    h = `${brand()}<div class="left" style="top:160px;width:1700px"><span class="step">Masalah</span><h1>${s.title}</h1>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:60px">
        <div class="card"><span class="tag" style="background:#E8F2EE;color:#0B4F4A">● Pangan layak</span><h3 style="margin-top:22px">Belum disajikan, tertutup</h3><p>Masih aman dimakan bila sampai ke warga dalam batas waktu. Selama ini tidak ada yang mencocokkan.</p></div>
        <div class="card"><span class="tag" style="background:#F3EDE6;color:#7A5C3E">● Sisa piring</span><h3 style="margin-top:22px">Bekas makan siswa</h3><p>Tidak untuk manusia. Bernilai untuk maggot dan kompos, tetapi sering berakhir di TPA.</p></div>
      </div>
      <div class="lockbar" style="background:#FBECE8;color:#9c3a26"><b style="color:#9c3a26">Tercampur · tanpa pencocokan · keluhan tanpa jalur</b></div></div>`
  } else if (s.layout === 'iot') {
    document.body.className = 'mint'
    h = `${brand()}<div class="left" style="top:150px;width:1700px"><span class="step">Integrasi IoT</span><h1>${s.title}</h1>
      <div class="nodes">
        <div class="node"><span class="k">SENSOR</span><b>Load cell + HX711</b><p>Menimbang isi wadah. DS18B20 mengukur suhu, reed switch membaca tutup.</p></div>
        <div class="node"><span class="k">PENGENDALI</span><b>ESP32</b><p>Rata-rata 10 bacaan. Kirim tiap 10 dtk atau saat berat berubah.</p></div>
        <div class="node"><span class="k">JARINGAN</span><b>HTTPS / MQTT</b><p>Wi-Fi dapur, kunci per perangkat. Antre 30 pesan bila putus.</p></div>
        <div class="node hl"><span class="k">SERVER</span><b>API RANTANG</b><p>Validasi, simpan, siarkan lewat SSE. Notifikasi WhatsApp.</p></div>
        <div class="node"><span class="k">APLIKASI</span><b>PWA</b><p>Berat terisi otomatis, peringatan suhu, dasbor.</p></div>
      </div>
      <pre style="margin-top:44px">POST /api/iot/telemetry   ·   MQTT rantang/sppg-01/bin/RTG-01-L/telemetry
{ <i>"device_id"</i>: "RTG-01-L", <i>"stream"</i>: "layak", <i>"weight_g"</i>: 6420, <i>"temp_c"</i>: 64.3, <i>"battery_pct"</i>: 86, <i>"rssi"</i>: -61 }</pre></div>`
  } else if (s.layout === 'phone') {
    h = `${brand()}<div class="left" style="top:200px;width:1000px"><span class="step">${s.step}</span><h1>${s.title}</h1>
      <ul class="b">${s.bullets.map((b) => `<li>${b}</li>`).join('')}</ul></div>
      ${phone(1310, 66, `<div class="slot" id="slot" style="background:#fff"></div>`)}`
  } else if (s.layout === 'rules') {
    document.body.className = 'mint'
    h = `${brand()}<div class="left" style="top:150px;width:1700px"><span class="step">${s.step}</span><h1>${s.title}</h1>
      <div style="margin-top:56px">
        <div class="lane"><div class="pill" style="background:#E8F2EE;color:#0B4F4A;width:300px">Pangan layak</div><span class="arrow">→</span>
          <div class="pill" style="background:#fff;border:2px solid #CFE2DD">Penerima terdekat yang aktif</div><span class="arrow">→</span>
          <div class="pill" style="background:#fff;border:2px solid #CFE2DD">Penerima berikutnya</div><span class="arrow">→</span>
          <div class="pill" style="background:#fff;border:2px solid #CFE2DD">Pengolah</div></div>
        <p class="note" style="margin-left:322px">Tidak dijawab 30 menit → dialihkan. Lewat 4 jam dari jam masak → hanya pengolah.</p>
        <div class="lane" style="margin-top:44px"><div class="pill" style="background:#F3EDE6;color:#7A5C3E;width:300px">Sisa piring</div><span class="arrow">→</span>
          <div class="pill" style="background:#fff;border:2px solid #CFE2DD">Pengolah maggot / kompos</div>
          <span style="font-size:26px;font-weight:700;color:#9c3a26;margin-left:20px">✕ tidak pernah ke warga</span></div>
      </div>
      <div class="lockbar"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F2C200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span><b>Terkunci di kode.</b> Aturan yang sama dipakai aplikasi dan server, tidak bisa diubah pengguna.</span></div></div>`
  } else if (s.layout === 'twophones') {
    h = `${brand()}<div class="left" style="top:200px;width:800px"><span class="step">${s.step}</span><h1 style="font-size:54px;max-width:760px">${s.title}</h1>
      <ul class="b"><li>Luring: simpan di ponsel, kirim otomatis</li><li>Tiket: bau, jatah, mutu, jadwal, perilaku</li><li>Tenggat 3 hari, lalu ke lurah dan DLH</li></ul></div>
      ${phone(990, 66, `<img src="${IMG(s.images[0])}">`)}${phone(1460, 66, `<img src="${IMG(s.images[1])}">`)}`
  } else if (s.layout === 'laptop') {
    document.body.className = 'mint'
    h = `${brand()}<div style="position:absolute;left:110px;top:150px;width:560px"><span class="step">${s.step}</span><h1 style="font-size:56px">${s.title}</h1>
      <ul class="b"><li>Kg dialihkan dari TPA</li><li>% layak sampai ke warga</li><li>Pihak aktif, keluhan ≤3 hari</li><li>Ekspor CSV</li></ul></div>
      <div class="laptop" style="left:720px;top:150px"><div class="screen"><div class="slot" id="slot"></div></div><div class="base"></div></div>`
  } else if (s.layout === 'end') {
    document.body.className = 'dark'
    h = `<div class="ring" style="width:1000px;height:1000px;right:-320px;bottom:-420px"></div>
      <div style="position:absolute;left:140px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:1300px">
        <div class="tile" style="width:110px;height:110px;border-radius:30px"><img src="${LOGO}" style="width:78px"></div>
        <h1 style="font-size:72px;margin-top:40px">${s.title}</h1>
        <p style="font-size:32px;margin-top:40px;opacity:.85">github.com/YusufArrayyan/RANTANG</p></div>`
  }
  document.getElementById('r').innerHTML = h
  const slot = document.getElementById('slot')
  if (!slot) return null
  const r = slot.getBoundingClientRect()
  slot.style.background = '#fff'
  return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) }
}
</script>
</body>
</html>
